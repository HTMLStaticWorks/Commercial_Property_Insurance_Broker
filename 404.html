<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found | FastFund</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <meta name="theme-color" content="#0E1A2B">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Apply saved theme / direction before first paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('fastfund-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        if (localStorage.getItem('fastfund-rtl') === 'true') document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,250..600;1,9..144,250..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
  <main class="center-page">
    <div class="center-card anim-in">
      <div class="big-number">4<span>0</span>4</div>
      <h1 style="font-size: var(--size-h2);">This page has <span class="hl">moved on</span></h1>
      <p class="lead">The page you are looking for does not exist or has been moved.</p>
      <div class="cta-actions" style="margin-block-start: var(--sp-8);">
        <a href="index.html" class="btn btn-primary btn-lg"><i class="ph ph-house"></i> Return to home</a>
        <a href="contact.html" class="btn btn-outline btn-lg">Contact support</a>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
