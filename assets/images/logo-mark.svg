<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <!-- Metallic Gold & Royal Amber Gradient -->
    <linearGradient id="ff-gold-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89C" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    
    <!-- Deep Ink Base Gradient -->
    <linearGradient id="ff-ink-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glassmorphic Glow Filter -->
    <filter id="ff-glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle / Hex Shield with Gold Metallic Stroke -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#ff-ink-bg)" stroke="url(#ff-gold-primary)" stroke-width="1.75" filter="url(#ff-glow-shadow)"/>

  <!-- Combined Emblem: Protection Shield + Architectural Building Vault + Upward Speed Arrow -->
  <!-- Outer Crest Shield outline -->
  <path d="M20 7.5L29.5 12V19.5C29.5 24.8 25.5 29.5 20 31C14.5 29.5 10.5 24.8 10.5 19.5V12L20 7.5Z" fill="url(#ff-gold-primary)" fill-opacity="0.12" stroke="url(#ff-gold-primary)" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Dynamic Upward Growth Apex Arrow -->
  <path d="M14.5 21L20 15L25.5 21" stroke="url(#ff-gold-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Vertical Support Column (Architecture & Capital Foundation) -->
  <path d="M20 15V25" stroke="url(#ff-gold-primary)" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Crown Apex Dot -->
  <circle cx="20" cy="11.5" r="1.5" fill="url(#ff-gold-primary)"/>
</svg>
