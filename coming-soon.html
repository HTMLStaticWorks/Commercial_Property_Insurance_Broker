<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | FastFund</title>
  <meta name="description" content="A new FastFund feature is on the way. Join the waitlist.">
  <meta name="theme-color" content="#0E1A2B">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Apply saved theme / direction before first paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('fastfund-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        if (localStorage.getItem('fastfund-rtl') === 'true') document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,250..600;1,9..144,250..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
  <main class="center-page">
    <div class="center-card anim-in">
      <div><a href="index.html" class="logo" aria-label="FastFund home">
          <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 3.5L26.5 8.25V15.75C26.5 21.2 22 25.8 16 27.5C10 25.8 5.5 21.2 5.5 15.75V8.25L16 3.5Z" class="logo-shield" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M11 18L16 13L21 18" class="logo-arrow" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 13V22" class="logo-stem" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="9.5" r="1.4" class="logo-dot" fill="currentColor"/></svg></span>
          <span class="logo-text">Fast<em>Fund</em></span>
        </a></div>
      <span class="eyebrow eyebrow-pill">In development</span>
      <h1 style="font-size: var(--size-h2);">We're launching something <span class="hl">new</span></h1>
      <p class="lead">Our new feature is currently under development. Leave your email to get notified when it goes live.</p>

      <div class="countdown force-ltr">
        <div><strong>07</strong><span>Days</span></div>
        <div><strong>14</strong><span>Hours</span></div>
        <div><strong>45</strong><span>Mins</span></div>
      </div>

      <!-- Mailchimp Placeholder -->
      <!-- MAILCHIMP_EMBED -->
      <form class="needs-validation inline-form" novalidate>
        <input type="email" class="form-control" placeholder="Enter your email" aria-label="Email address" required>
        <button type="submit" class="btn btn-primary">Notify me</button>
      </form>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
